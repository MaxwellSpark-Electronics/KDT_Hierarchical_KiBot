# KiBot output for generating Position file in CSV format
# https://kibot.readthedocs.io/en/latest/configuration/outputs/position.html
#
# Uses the built-in `_rot_footprint_jlcpcb` filter to apply JLCPCB-specific
# rotation and pin-1 offset corrections (polarised caps, SOIC, SOT-23, Molex
# connectors, etc.) and emits JLC-compatible column headers so the file can be
# uploaded directly to JLCPCB's SMT assembly service.

kibot:
  version: 1

outputs:
- name: @NAME@
  comment: '@COMMENT@'
  type: position
  category: '@DIR@'
  dir: '@DIR@'
  options:
    format: 'CSV'
    units: millimeters
    only_smd: false
    include_virtual: false
    output: '%f-CPL%I%v.%x'
    separate_files_for_front_and_back: false
    pre_transform: _rot_footprint_jlcpcb
    columns:
      - id: Ref
        name: Designator
      - id: PosX
        name: Mid X
      - id: PosY
        name: Mid Y
      - id: Rot
        name: Rotation
      - id: Side
        name: Layer

definitions:
  NAME: csv_position
  COMMENT: Position file in CSV format
  DIR: Manufacturing/Assembly
