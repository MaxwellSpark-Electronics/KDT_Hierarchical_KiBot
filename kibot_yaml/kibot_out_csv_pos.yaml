# KiBot output for generating Position file in CSV format
# https://kibot.readthedocs.io/en/latest/configuration/outputs/position.html
#
# Emits JLCPCB-compatible column headers and uses the aux axis as origin so the
# file can be uploaded directly to JLCPCB's SMT assembly service.
#
# No rotation pre-transform is applied: the built-in `_rot_footprint_jlcpcb`
# filter reflects JLC's legacy library convention and now over-rotates many
# parts (caps, diodes, SOT-23, etc.) because JLC has since updated their
# library. Any residual orientation mismatches should be corrected in JLC's
# web preview and saved against the LCSC part.

kibot:
  version: 1

outputs:
- name: @NAME@
  comment: '@COMMENT@'
  type: position
  category: '@DIR@'
  dir: '@DIR@'
  options:
    format: 'CSV'
    units: millimeters
    use_aux_axis_as_origin: true
    only_smd: false
    include_virtual: false
    output: '%f-CPL%I%v.%x'
    separate_files_for_front_and_back: false
    columns:
      - id: Ref
        name: Designator
      - id: PosX
        name: Mid X
      - id: PosY
        name: Mid Y
      - id: Rot
        name: Rotation
      - id: Side
        name: Layer

definitions:
  NAME: csv_position
  COMMENT: Position file in CSV format
  DIR: Manufacturing/Assembly
